[tool.poetry]
name = "microturbogeo"
version = "0.1.0"
description = "CFD-ready fluid-domain geometry for micro-turbojet and UAV axial turbomachinery blade rows"
authors = ["Pavan Kumar Karsinapu", "Tesseract Software Limited (original ProtoBlade)"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "microturbogeo", from = "src"}]

[tool.poetry.scripts]
microturbogeo = "microturbogeo.__main__:run"

[tool.poetry.dependencies]
python = ">=3.9"
numpy = ">=1.24"
scipy = ">=1"
cadquery = ">=2.4"
tomli = "^2"
atom = ">=0.10"

[tool.poetry.group.dev.dependencies]
pytest = ">=7"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
